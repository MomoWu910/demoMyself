<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">

  <title>Golden Hall · Cocos Creator 賭場大廳</title>

  <meta name="viewport"
        content="width=device-width,user-scalable=no,initial-scale=1,minimum-scale=1,maximum-scale=1,minimal-ui=true"/>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <meta name="renderer" content="webkit"/>
  <meta name="force-rendering" content="webkit"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
  <meta name="msapplication-tap-highlight" content="no">
  <meta name="full-screen" content="yes"/>
  <meta name="x5-fullscreen" content="true"/>
  <meta name="360-fullscreen" content="true"/>
  <meta name="x5-page-mode" content="app">

  <!--
    ★ 引擎先排隊，不要等前面那串小檔案跑完。

    預設的載入鏈是串行的：index.html → style.css → polyfills → system.bundle
    → import-map.json → index.js → application.js → **才輪到 cc.js**。
    每一段都是一個來回，實測在 GitHub Pages 上前置那串就吃掉 2.7 秒，
    而引擎（最大的那一個）在那之前一個 byte 都還沒開始下載。

    preload 讓瀏覽器在解析到 <head> 的當下就去拿引擎，跟前面那串並行。
    ⚠️ 路徑寫死是可行的，因為建置設定 md5Cache 是關的（檔名不帶 hash）；
    改成帶 hash 的話這一行要跟著改，不然會變成多下載一份沒用的檔案。
  -->
  <link rel="preload" as="script" href="cocos-js/cc.js">
  <link rel="preload" as="script" href="index.js">
  <link rel="preload" as="fetch" href="src/import-map.json" crossorigin>
  <link rel="preload" as="image" href="loading.webp" fetchpriority="high">

  <link rel="stylesheet" type="text/css" href="style.css"/>

  <!--
    載入畫面直接寫在這裡，**不走任何額外請求**：它要在第一個位元組之後就看得到，
    而那正是引擎還沒到、畫面一片空白的那十幾秒。字體只用系統字，不載 webfont。
  -->
  <style>
    #boot {
      position: fixed; inset: 0; z-index: 9999;
      display: grid; place-items: center; overflow: hidden;
      background: #070604; color: #f2ece1;
      font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      opacity: 1; visibility: visible;
      transition: opacity .45s ease, visibility 0s;
    }
    #boot::before {
      content: ""; position: absolute; inset: -2%;
      background: url("loading.webp") center / cover no-repeat;
      opacity: .78; transform: scale(1.02);
    }
    #boot::after {
      content: ""; position: absolute; inset: 0;
      background:
        radial-gradient(circle at 50% 48%, rgba(9, 7, 5, .08) 0 24%, rgba(7, 6, 4, .48) 57%, rgba(4, 3, 2, .78) 100%),
        linear-gradient(180deg, rgba(0, 0, 0, .2), transparent 28%, transparent 72%, rgba(0, 0, 0, .46));
    }
    #boot.done { opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .45s ease, visibility 0s .45s; }
    #boot .panel {
      position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center;
      width: min(440px, 82vw); gap: 14px; padding-top: 1vh;
      filter: drop-shadow(0 4px 18px rgba(0, 0, 0, .72));
    }
    #boot .mark {
      font: 600 clamp(22px, 4vw, 38px)/1 Georgia, "Times New Roman", serif;
      letter-spacing: .19em; color: #e1c17d; text-indent: .19em;
      text-shadow: 0 1px 0 #4e3516, 0 0 22px rgba(212, 168, 81, .24);
    }
    #boot .sub { font-size: 10px; letter-spacing: .34em; color: #9d7a3d; text-indent: .34em; }
    #boot .rule { width: 68px; height: 1px; background: linear-gradient(90deg, transparent, #d3ab61, transparent); }
    #boot .bar {
      width: min(300px, 66vw); height: 2px; margin-top: 8px; border-radius: 2px;
      background: rgba(217, 184, 113, .14); overflow: hidden;
    }
    #boot .bar i {
      display: block; height: 100%; width: 6%; border-radius: 2px;
      background: linear-gradient(90deg, #75501f, #f1d99f, #9a6d2e);
      box-shadow: 0 0 10px rgba(237, 204, 132, .5);
      transition: width .45s cubic-bezier(.22, .61, .36, 1), transform .25s ease;
    }
    #boot.busy .bar i { width: 34%; animation: casino-loading 1.25s ease-in-out infinite; }
    #boot .note { font-size: 12px; letter-spacing: .12em; color: #b8aa95; min-height: 1.2em; }
    @keyframes casino-loading { from { transform: translateX(-110%); } to { transform: translateX(300%); } }
    @media (prefers-reduced-motion: reduce) {
      #boot, #boot .bar i { transition-duration: .01ms; }
      #boot.busy .bar i { animation: none; width: 70%; opacity: .72; }
    }

    /*
     * 直向提示。
     *
     * 四個場景的版面都是照 1280×720 排的，直向手機的可視範圍是 1280×2277——
     * 內容擠成中間一條，上下全是空的。網頁沒有辦法真的鎖定螢幕方向
     * （`screen.orientation.lock()` 要先進全螢幕，iOS Safari 根本沒有這支 API），
     * 所以照業界做法擋一層提示，等使用者自己轉過來。
     *
     * `pointer: coarse` 是關鍵：只對觸控裝置生效。少了它，桌機把視窗拉窄成直的
     * 也會被蓋住——而桌機那個情境是 RWD 該處理的，不是叫人轉螢幕。
     */
    #rotate { display: none; }
    @media (orientation: portrait) and (pointer: coarse) {
      #rotate {
        position: fixed; inset: 0; z-index: 10000;
        display: grid; place-items: center; gap: 0;
        background: #070604; color: #f2ece1;
        font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      }
    }
    #rotate .inner { display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; }
    #rotate .phone {
      width: 54px; height: 88px; border: 2px solid #d3ab61; border-radius: 9px;
      position: relative; animation: casino-rotate 2.4s ease-in-out infinite;
    }
    #rotate .phone::after {
      content: ""; position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%);
      width: 16px; height: 2px; border-radius: 2px; background: rgba(211, 171, 97, .62);
    }
    #rotate .mark {
      font: 600 clamp(19px, 5.4vw, 26px)/1 Georgia, "Times New Roman", serif;
      letter-spacing: .19em; color: #e1c17d; text-indent: .19em;
      text-shadow: 0 1px 0 #4e3516, 0 0 22px rgba(212, 168, 81, .24);
    }
    #rotate .rule { width: 68px; height: 1px; background: linear-gradient(90deg, transparent, #d3ab61, transparent); }
    #rotate .tip { font-size: 15px; letter-spacing: .08em; color: #c9bca4; line-height: 1.7; }
    #rotate .sub { font-size: 10px; letter-spacing: .34em; color: #9d7a3d; text-indent: .34em; }
    @keyframes casino-rotate {
      0%, 42% { transform: rotate(0deg); }
      58%, 100% { transform: rotate(-90deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      #rotate .phone { animation: none; transform: rotate(-90deg); }
    }
  </style>
</head>
<body>
  <div id="GameDiv" cc_exact_fit_screen="true">
      <div id="Cocos3dGameContainer">
        <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="99"></canvas>
      </div>
  </div>

  <div id="rotate" role="alertdialog" aria-live="polite">
    <div class="inner">
      <div class="phone"></div>
      <div class="mark">GOLDEN HALL</div>
      <div class="rule"></div>
      <div class="tip">請將裝置轉為橫向<br>牌桌是照 16:9 排的</div>
      <div class="sub">ROTATE TO PLAY</div>
    </div>
  </div>

  <div id="boot" role="status" aria-live="polite">
    <div class="panel">
      <div class="mark">GOLDEN HALL</div>
      <div class="rule"></div>
      <div class="sub">PRIVATE GAMING SALON</div>
      <div class="bar"><i></i></div>
      <div class="note">載入引擎…</div>
    </div>
  </div>

  <script>
    /*
     * 進度是**照真的發生的事**推進的，不是計時器假裝的。
     *
     * 引擎本身沒有下載進度可讀（SystemJS 用 <script> 載，拿不到 stream），
     * 但「哪一個檔案到了」是知道的 —— PerformanceObserver 會在每個資源完成時通知。
     * 所以進度分段：引擎到了、設定讀完了、大廳的包到了、美術畫好了。
     *
     * 最後一段由 Cocos 主動呼叫 `__casinoLoading.finish()`：大廳與三款玩法都在
     * 必要美術實際套到節點後才揭開。遮罩不移除，因此場景切換可以重用同一個 DOM，
     * 不會為每款玩法再下載一張 loading 圖。
     */
    (function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      var bar = boot.querySelector('.bar i');
      var note = boot.querySelector('.note');
      var pct = 6;

      var generation = 0;

      function step(next, text) {
        if (next <= pct) return;
        pct = next;
        boot.classList.remove('busy');
        bar.style.width = pct + '%';
        if (text) note.textContent = text;
      }

      function show(text) {
        generation += 1;
        pct = 6;
        boot.classList.remove('done');
        boot.classList.add('busy');
        boot.setAttribute('aria-hidden', 'false');
        bar.style.width = '34%';
        note.textContent = text || '正在準備…';
      }

      function finish() {
        var mine = generation;
        boot.classList.remove('busy');
        bar.style.width = '100%';
        note.textContent = '準備完成';
        setTimeout(function () {
          if (mine !== generation) return;
          boot.classList.add('done');
          boot.setAttribute('aria-hidden', 'true');
        }, 180);
      }

      window.__casinoLoading = { show: show, finish: finish };

      var STAGES = [
        { re: /cocos-js\/cc\.js/, pct: 58, text: '讀取設定…' },
        { re: /settings\.json/, pct: 72, text: '載入大廳…' },
        { re: /assets\/main\//, pct: 86, text: '準備牌桌…' }
      ];

      try {
        var po = new PerformanceObserver(function (list) {
          list.getEntries().forEach(function (e) {
            STAGES.forEach(function (s) { if (s.re.test(e.name)) step(s.pct, s.text); });
          });
        });
        po.observe({ type: 'resource', buffered: true });
      } catch (err) { /* 不支援就只靠下面的輪詢 */ }

      // 保險：請求若卡死，45 秒後仍揭開程式繪製的降級畫面，不把玩家永遠關住。
      setTimeout(function () {
        if (!boot.classList.contains('done')) finish();
      }, 45000);
    })();
  </script>

  <script src="src/polyfills.bundle.js" charset="utf-8"> </script>
  <script src="src/system.bundle.js" charset="utf-8"> </script>
  <script src="src/import-map.json" type="systemjs-importmap" charset="utf-8"> </script>

  <script>
    System.import('./index.js').catch(function (err) { console.error(err); })
  </script>
</body>
</html>
