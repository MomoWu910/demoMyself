<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eric Wu | Game Developer Portfolio</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a1a; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        h1 { margin-bottom: 10px; }
        p { color: #aaa; margin-bottom: 40px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; width: 80%; max-width: 800px; }
        .card { background: #2d2d2d; padding: 20px; border-radius: 10px; text-align: center; text-decoration: none; color: white; transition: transform 0.2s; border: 1px solid #444; }
        .card:hover { transform: translateY(-5px); border-color: #00d2ff; }
        .card h3 { margin: 10px 0; color: #00d2ff; }
        .card span { font-size: 12px; color: #888; border: 1px solid #555; padding: 2px 6px; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Eric Wu</h1>
    <p>Senior Game Frontend Engineer Portfolio</p>

    <div class="grid">
        <a href="./babylon.html" class="card">
            <h3>🎰 3D Casino Demo</h3>
            <p>Built with Babylon.js & TypeScript</p>
            <div>
                <span>BABYLON 8</span><span>WebGL</span> <span>GLTF Loading</span>
            </div>
        </a>

        <a href="./pixi_hub.html" class="card">
            <h3>🚀 PixiJS Demos</h3>
            <p>Collection of 2D rendering tests</p>
            <div>
                <span>PixiJS</span> <span>Benchmark</span>
            </div>
        </a>
    </div>
</body>
</html>
