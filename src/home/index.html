<!DOCTYPE html>
<html lang="zh-TW" style="background-color: #0b0c10;">
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#0b0c10">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title data-i18n="title.home">Eric Wu | Interactive 3D & Frontend Demos</title>
    <!--
      首屏底色要跟天色對齊。這段**必須**留在 head 裡的 inline script，不能搬進 bundle——
      bundle 載完已經是首次繪製之後，白天打開會先閃一次深墨再翻淺。

      代價是時段寫死在這裡：7.3 / 16.8 要跟 sky.ts 的 LIGHT_FROM / LIGHT_TO 一致，
      那兩個數是逐時截圖量背景亮度、取它跨過白字↔深字對比交叉點的時刻。
      **調 sky.ts 的 keyframe 就要回來改這兩個數**，否則首屏會跟天色差半拍。
      放在 bootHead 之前：它會把當下的 background-color 記成還原目標，正好是這裡設的天色。
    -->
    <script>(function(){var h=document.documentElement,t;
    var m=location.search.match(/[?&]hour=([\d.]+)/);
    if(m){t=+m[1]}else{var d=new Date();t=d.getHours()+d.getMinutes()/60}
    var c=(t>7.3&&t<16.8)?'#cfe0ee':'#0b0c10';
    h.style.backgroundColor=c;
    var e=document.querySelector('meta[name=theme-color]');if(e)e.content=c;})();</script>
    <%= bootHead %>
    <%= i18nHead %>
</head>
<body class="home-graph">
    <!-- canvas 內的世界：Pixi 光場 + 節點 + 資源流動 -->
    <div id="field-stage"></div>
    <!-- canvas 外的殼：React -->
    <div id="overlay-root"></div>
    <!-- 語言切換：i18n 掛進來 -->
    <div id="lang-slot"></div>
    <%= i18nBoot %>
</body>
</html>
