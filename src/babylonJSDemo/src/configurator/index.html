<!DOCTYPE html>
<html lang="zh-TW" style="background-color:#0f0f11;">
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#0f0f11">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Configurator</title>
    <style>
        :root {
            --accent: #00d2ff;
            --panel-bg: rgba(20, 20, 24, 0.55);
            --panel-border: rgba(255, 255, 255, 0.08);
            --text: #f4f4f5;
            --text-muted: #a1a1aa;
        }
        html, body { overflow: hidden; width: 100%; height: 100%; margin: 0; padding: 0; background: #0f0f11; font-family: 'Segoe UI', Inter, system-ui, sans-serif; }
        #renderCanvas { width: 100%; height: 100%; touch-action: none; display: block; outline: none; }

        .back-btn {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            background: rgba(0,0,0,0.45); color: var(--text); padding: 9px 16px;
            text-decoration: none; border-radius: 10px; font-size: 0.85rem;
            border: 1px solid var(--panel-border); backdrop-filter: blur(8px);
            transition: background 0.2s;
        }
        .back-btn:hover { background: rgba(0,0,0,0.7); }

        /* 左上角標題 */
        .title-block { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 10; text-align: center; pointer-events: none; }
        .title-block h1 { margin: 0; font-size: 1.05rem; font-weight: 600; color: var(--text); letter-spacing: 0.5px; }
        .title-block p { margin: 2px 0 0; font-size: 0.75rem; color: var(--text-muted); }

        /* 底部控制面板 */
        .panel {
            position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%); z-index: 10;
            display: flex; align-items: center; gap: 22px;
            background: var(--panel-bg); border: 1px solid var(--panel-border);
            border-radius: 16px; padding: 16px 22px; backdrop-filter: blur(16px);
            box-shadow: 0 8px 40px rgba(0,0,0,0.4);
        }
        .panel .group { display: flex; flex-direction: column; gap: 8px; }
        .panel .label { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        .swatches { display: flex; gap: 10px; }
        .swatch {
            width: 38px; height: 38px; border-radius: 50%; cursor: pointer;
            border: 2px solid transparent; transition: transform 0.15s, border-color 0.15s;
            position: relative;
        }
        .swatch:hover { transform: scale(1.08); }
        .swatch.active { border-color: var(--accent); box-shadow: 0 0 12px rgba(0,210,255,0.5); }
        .swatch span {
            position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%);
            font-size: 0.6rem; color: var(--text-muted); white-space: nowrap; text-transform: capitalize;
        }

        .divider { width: 1px; align-self: stretch; background: var(--panel-border); }

        .ctrl-btn {
            background: rgba(255,255,255,0.06); color: var(--text); border: 1px solid var(--panel-border);
            padding: 9px 14px; border-radius: 10px; font-size: 0.8rem; cursor: pointer;
            display: inline-flex; align-items: center; gap: 7px; transition: all 0.18s;
        }
        .ctrl-btn:hover { background: rgba(255,255,255,0.12); }
        .ctrl-btn.on { color: var(--accent); border-color: rgba(0,210,255,0.4); background: rgba(0,210,255,0.1); }

        /* 載入畫面 */
        #loading {
            position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 18px; background: #0f0f11;
            transition: opacity 0.5s; color: var(--text-muted);
        }
        #loading.hidden { opacity: 0; pointer-events: none; }
        .spinner {
            width: 42px; height: 42px; border: 3px solid rgba(255,255,255,0.12);
            border-top-color: var(--accent); border-radius: 50%; animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading p { margin: 0; font-size: 0.85rem; letter-spacing: 0.5px; }
    </style>
</head>
<body>
    <a href="./index.html" class="back-btn">← Back to Home</a>

    <div class="title-block">
        <h1>Product Configurator</h1>
        <p>Babylon.js · PBR · glTF material variants · IBL studio lighting</p>
    </div>

    <canvas id="renderCanvas"></canvas>

    <div class="panel" id="panel" style="display:none;">
        <div class="group">
            <span class="label">Colorway</span>
            <div class="swatches" id="swatches"></div>
        </div>
        <div class="divider"></div>
        <div class="group" style="flex-direction:row; align-items:flex-end; gap:10px;">
            <button class="ctrl-btn on" id="autorotate">◐ Auto-rotate</button>
            <button class="ctrl-btn" id="reset">⟲ Reset</button>
        </div>
    </div>

    <div id="loading">
        <div class="spinner"></div>
        <p>Loading 3D model…</p>
    </div>
</body>
</html>
